<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Управленческий трекер проектов</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;

      --brand: #2563eb;
      --brand-hover: #1d4ed8;
      --brand-subtle: #eff6ff;
      --brand-border: #bfdbfe;

      --done: #15803d;
      --done-bg: #f0fdf4;
      --done-border: #bbf7d0;

      --amber: #b45309;
      --amber-bg: #fffbeb;
      --amber-border: #fde68a;

      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --danger-border: #fca5a5;

      --neutral-dark: #334155;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 8px 10px 100px 10px;
      font-size: 15px;
      line-height: 1.45;
    }

    .app-container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* 1. ПАНЕЛЬ РУКОВОДИТЕЛЯ */
    .dashboard-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .dash-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .dash-title {
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #0f172a;
    }

    .sync-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      background: #f1f5f9;
      color: #475569;
    }
    .sync-badge.active {
      background: #e0f2fe;
      color: #0369a1;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    @media (max-width: 480px) {
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .metric-card {
      padding: 8px 10px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      border: 1px solid transparent;
      background: #f8fafc;
      color: var(--neutral-dark);
    }
    .metric-card.has-danger {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: var(--danger-border);
    }
    .metric-card.is-green {
      background: var(--done-bg);
      color: var(--done);
      border-color: var(--done-border);
    }
    .metric-card.is-amber {
      background: var(--amber-bg);
      color: var(--amber);
      border-color: var(--amber-border);
    }
    .metric-card.is-blue {
      background: var(--brand-subtle);
      color: #1d4ed8;
      border-color: var(--brand-border);
    }

    .metric-lbl {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      opacity: 0.85;
    }
    .metric-num {
      font-size: 18px;
      font-weight: 800;
      margin-top: 2px;
    }

    .report-modes {
      display: flex;
      gap: 6px;
    }
    .report-mode-btn {
      flex: 1;
      padding: 7px 8px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .report-mode-btn.active {
      background: var(--neutral-dark);
      color: #ffffff;
      border-color: var(--neutral-dark);
    }

    /* 2. БЫСТРЫЙ ВВОД НАПРАВЛЕНИЯ */
    .quick-add-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .quick-add-bar input {
      flex: 1;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      outline: none;
    }
    .quick-add-bar input:focus {
      border-color: var(--brand);
    }
    .btn-dark {
      background: var(--neutral-dark);
      color: #ffffff;
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 3. КАРТОЧКА ПРОЦЕССА */
    .process-section {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .process-header {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid var(--border-subtle);
    }

    .proc-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
    }
    .proc-arrow {
      font-size: 11px;
      color: var(--text-muted);
      transition: transform 0.2s;
    }
    .proc-arrow.collapsed {
      transform: rotate(-90deg);
    }

    .proc-del-link {
      color: var(--text-subtle);
      font-size: 12px;
      background: none;
      border: none;
      cursor: pointer;
    }
    .proc-del-link:hover {
      color: var(--danger);
    }

    .process-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .process-body.hidden {
      display: none;
    }

    /* 4. ОБЪЕКТЫ / ПРОЕКТЫ */
    .object-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .object-card.completed-obj {
      background: #fcfdfc;
      border-color: var(--done-border);
    }

    .obj-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .obj-name {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      flex: 1;
      cursor: pointer;
      word-break: normal;
      overflow-wrap: break-word;
    }
    .obj-tools {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .badge-percent {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 12px;
      background: #f1f5f9;
      color: #475569;
      white-space: nowrap;
    }
    .badge-percent.green {
      background: var(--done-bg);
      color: var(--done);
      border: 1px solid var(--done-border);
    }

    .btn-icon-tool {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12px;
      cursor: pointer;
      color: #475569;
    }
    .btn-icon-tool:hover {
      background: #f1f5f9;
    }
    .btn-icon-tool.del:hover {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: var(--danger-border);
    }

    /* Прогресс-бар */
    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: #f1f5f9;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--brand);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .progress-bar-fill.done {
      background: var(--done);
    }

    /* 5. ШАГИ / ЭТАПЫ */
    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .step-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid var(--border-subtle);
    }
    .step-item.is-done {
      background: var(--done-bg);
      border-color: var(--done-border);
    }
    .step-item.has-blocker {
      background: var(--danger-bg);
      border-color: var(--danger-border);
    }

    /* Верхняя строка: чекбокс + текст */
    .step-header-line {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      width: 100%;
    }
    .step-chk {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--done);
      margin-top: 1px;
      flex-shrink: 0;
    }
    .step-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      line-height: 1.35;
      flex: 1;
      word-break: normal;
      overflow-wrap: break-word;
      hyphens: none;
    }
    .step-item.is-done .step-title {
      text-decoration: line-through;
      color: var(--done);
      opacity: 0.7;
    }

    /* Нижняя строка: дата, риск, удаление */
    .step-footer-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-left: 27px;
    }

    .step-actions-left {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .step-date-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .step-date-tag.overdue {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #991b1b;
    }
    .step-date-tag.urgent {
      background: #fef3c7;
      border-color: #fde68a;
      color: #92400e;
    }
    .step-date-tag.done {
      background: #ffffff;
      border-color: var(--done-border);
      color: var(--done);
    }

    .btn-blocker-trigger {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: #64748b;
      white-space: nowrap;
    }
    .btn-blocker-trigger:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .btn-blocker-trigger.active {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #991b1b;
      font-weight: 700;
    }

    .mini-del {
      background: none;
      border: none;
      color: var(--text-subtle);
      font-size: 13px;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .mini-del:hover {
      color: var(--danger);
      background: rgba(0,0,0,0.04);
    }

    /* Блокер плашка */
    .blocker-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #ffffff;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      color: #991b1b;
      font-weight: 600;
      margin-left: 27px;
    }
    .blocker-banner span.reason-text {
      flex: 1;
      cursor: pointer;
    }
    .blocker-clear-btn {
      background: none;
      border: none;
      color: #991b1b;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 4px;
    }

    /* 100% готовность */
    .all-done-banner {
      background: var(--done-bg);
      border: 1px dashed var(--done-border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .all-done-banner span {
      font-size: 12px;
      font-weight: 700;
      color: var(--done);
    }
    .btn-finish-work {
      background: var(--done);
      color: #ffffff;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Форма добавления шага */
    .step-add-toggle-btn {
      background: none;
      border: 1px dashed var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      margin-top: 2px;
    }
    .step-add-toggle-btn:hover {
      background: #f8fafc;
      color: var(--text-main);
    }

    .step-fast-add {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 2px;
    }

    .template-chips-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 2px;
    }
    .tpl-chip {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .tpl-chip:hover {
      background: var(--brand-subtle);
      border-color: var(--brand-border);
      color: var(--brand);
    }
    .tpl-chip.preset-all {
      background: var(--done-bg);
      border-color: var(--done-border);
      color: var(--done);
      font-weight: 700;
    }

    .sfa-row-1 {
      display: flex;
      gap: 6px;
    }
    .sfa-row-1 input[type="text"] {
      flex: 1;
      padding: 7px 9px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
    }
    .sfa-row-1 input.date-input {
      width: 120px;
      padding: 7px 6px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      background: #fff;
    }

    .sfa-row-2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .quick-chips {
      display: flex;
      gap: 3px;
    }
    .chip {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn-add-step {
      background: var(--neutral-dark);
      color: #ffffff;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Кнопки процессов */
    .proc-add-actions {
      display: flex;
      gap: 6px;
    }
    .btn-new-obj {
      flex: 1;
      background: #f8fafc;
      color: var(--neutral-dark);
      border: 1px dashed var(--border);
      padding: 8px 6px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .btn-new-obj.template {
      background: var(--brand-subtle);
      border-color: var(--brand-border);
      color: var(--brand);
    }

    /* Архив */
    .archive-section {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .archive-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .archive-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .archive-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
    }
    .btn-restore {
      background: none;
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    /* Плавающая нижняя панель */
    .floating-action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.05);
      display: flex;
      gap: 8px;
      z-index: 100;
      max-width: 860px;
      margin: 0 auto;
    }

    .fab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      color: #ffffff;
    }
    .fab-btn.copy { background: #16a34a; }
    .fab-btn.send { background: #0284c7; }

    /* Тост */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 200;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ПАНЕЛЬ РУКОВОДИТЕЛЯ -->
    <div class="dashboard-card">
      <div class="dash-top">
        <div class="dash-title">
          <span>📊</span> Мониторинг проектов
        </div>
        <div class="sync-badge active" id="syncTag">● Синхронизировано</div>
      </div>

      <div class="metrics-grid">
        <div class="metric-card" id="mBlockersCard">
          <span class="metric-lbl">Задержки</span>
          <span class="metric-num" id="mBlockers">0</span>
        </div>
        <div class="metric-card is-green">
          <span class="metric-lbl">Сделано</span>
          <span class="metric-num" id="mDone">0</span>
        </div>
        <div class="metric-card is-amber">
          <span class="metric-lbl">В работе</span>
          <span class="metric-num" id="mPlan">0</span>
        </div>
        <div class="metric-card is-blue">
          <span class="metric-lbl">Объектов</span>
          <span class="metric-num" id="mTotal">0</span>
        </div>
      </div>

      <div class="report-modes">
        <button class="report-mode-btn active" id="modeExecutive" onclick="setReportMode('executive')">
          ⚡ Сводка за сегодня
        </button>
        <button class="report-mode-btn" id="modeFull" onclick="setReportMode('full')">
          📋 Полный отчет
        </button>
      </div>
    </div>

    <!-- БЫСТРЫЙ ВВОД НАПРАВЛЕНИЯ -->
    <div class="quick-add-bar">
      <input type="text" id="newProcInput" placeholder="Новое направление (напр. Сервитуты)..." onkeydown="if(event.key==='Enter') addProcess()">
      <button class="btn-dark" onclick="addProcess()">+ Процесс</button>
    </div>

    <!-- СПИСОК ПРОЦЕССОВ И ОБЪЕКТОВ -->
    <div id="processesRoot"></div>
  </div>

  <!-- ПЛАВАЮЩАЯ ПАНЕЛЬ -->
  <div class="floating-action-bar">
    <button class="fab-btn copy" onclick="copyReport()">
      📋 Скопировать отчет
    </button>
    <button class="fab-btn send" onclick="shareToTelegram()">
      ✈️ Отправить в Telegram
    </button>
  </div>

  <div class="toast" id="toastMsg">Отчет скопирован!</div>

  <script>
    const tg = window.Telegram?.WebApp;
    const STORAGE_KEY = 'manager_daily_tracker_v11_reglament';

    if (tg) {
      tg.ready();
      tg.expand();
    }

    let reportMode = 'executive';

    // Регламент этапов с нормативными смещениями дней от текущей даты
    const STANDARD_WORKFLOW = [
      { text: "Акт сверки НАО", days: 3 },
      { text: "Экспликация Гипрозем", days: 7 },
      { text: "Утверждение ЗУП МИО", days: 15 },
      { text: "Постановление акима", days: 25 },
      { text: "Акт на землю, регистрация", days: 35 }
    ];

    function getTodayStr() {
      const d = new Date();
      const day = String(d.getDate()).padStart(2, '0');
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const y = d.getFullYear();
      return `${day}.${m}.${y}`;
    }

    function getTomorrowStr() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      const day = String(d.getDate()).padStart(2, '0');
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const y = d.getFullYear();
      return `${day}.${m}.${y}`;
    }

    // Расчет даты со смещением по регламенту: 'до ДД.ММ.ГГГГ'
    function getOffsetDateStr(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const day = String(d.getDate()).padStart(2, '0');
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const y = d.getFullYear();
      return `до ${day}.${m}.${y}`;
    }

    function analyzeDeadline(dateStr, isDone) {
      if (isDone) return { cls: 'done', text: dateStr };
      if (!dateStr) return { cls: '', text: 'Без даты' };

      const match = dateStr.match(/(\d{1,2})\.(\d{1,2})\.?(\d{4})?/);
      if (!match) return { cls: '', text: dateStr };

      const day = parseInt(match[1], 10);
      const month = parseInt(match[2], 10) - 1;
      const year = match[3] ? parseInt(match[3], 10) : new Date().getFullYear();

      const target = new Date(year, month, day);
      const today = new Date();
      today.setHours(0,0,0,0);
      target.setHours(0,0,0,0);

      const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return { cls: 'overdue', text: `🔴 Просрочено (${dateStr})` };
      } else if (diffDays === 0) {
        return { cls: 'urgent', text: `🟠 Сегодня (${dateStr})` };
      } else if (diffDays <= 2) {
        return { cls: 'urgent', text: `🟡 ${diffDays} дн. (${dateStr})` };
      }
      return { cls: '', text: `📅 ${dateStr}` };
    }

        id: 1,
        title: "Дополнительные зем участки",
        collapsed: false,
        showArchive: false,
        objects: [
          {
            id: 101,
            title: "Жылыой - ЛЭС",
            archived: false,
            showAddForm: false,
            steps: [
              { id: 1001, text: "Акт сверки НАО", date: getOffsetDateStr(3), done: true, blocker: null },
              { id: 1002, text: "Экспликация Гипрозем", date: getOffsetDateStr(7), done: false, blocker: "Оплата не идет у подрядчика" },
              { id: 1003, text: "Утверждение ЗУП МИО", date: getOffsetDateStr(15), done: false, blocker: null },
              { id: 1004, text: "Постановление акима", date: getOffsetDateStr(25), done: false, blocker: null },

            ]
          },
          {

            steps: [
              { id: 2001, text: "Акт сверки НАО", date: getOffsetDateStr(3), done: false, blocker: null },
              { id: 2002, text: "Экспликация Гипрозем", date: getOffsetDateStr(7), done: false, blocker: null }
            ]
          }
        ]
      }
    ];

    async function loadData() {
      const parseVal = (val) => {
        try {
          const p = JSON.parse(val);
          if (Array.isArray(p)) {
            state = p.map(pr => ({
              ...pr,
              showArchive: pr.showArchive || false,
              objects: (pr.objects || []).map(o => ({
                ...o,
                archived: !!o.archived,
                showAddForm: false,
                steps: (o.steps || []).map(s => ({
                  ...s,
                  blocker: s.blocker || null
                }))
              }))
            }));
          }
        } catch(e) {}
      };

      if (tg?.CloudStorage) {
        tg.CloudStorage.getItem(STORAGE_KEY, (err, val) => {
          if (!err && val) {
            parseVal(val);
          } else {
            const local = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('manager_daily_tracker_v10_refined') || localStorage.getItem('manager_daily_tracker_v9_mobile');
            if (local) parseVal(local);
          }
          render();
        });
      } else {
        const local = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('manager_daily_tracker_v10_refined') || localStorage.getItem('manager_daily_tracker_v9_mobile');
        if (local) parseVal(local);
        render();
      }
    }

    function saveData() {
      const json = JSON.stringify(state);
      localStorage.setItem(STORAGE_KEY, json);

      if (tg?.CloudStorage) {
        tg.CloudStorage.setItem(STORAGE_KEY, json, (err, ok) => {
          const tag = document.getElementById('syncTag');
          if (ok && tag) {
            tag.textContent = "● Синхронизировано";
            tag.classList.add('active');
          }
        });
      }
      render();
    }

    function haptic() {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function setReportMode(m) {
      reportMode = m;
      document.getElementById('modeExecutive').classList.toggle('active', m === 'executive');
      document.getElementById('modeFull').classList.toggle('active', m === 'full');
      showToast(m === 'executive' ? "Формат: Сводка за сегодня" : "Формат: Полный отчет");
    }

    function addProcess() {
      const input = document.getElementById('newProcInput');
      const val = input.value.trim();
      if (!val) return;

      state.push({
        id: Date.now(),
        title: val,
        collapsed: false,
        showArchive: false,
        objects: []
      });

      input.value = '';
      haptic();
      saveData();
    }

    function toggleProcessCollapse(procId) {
      const p = state.find(x => x.id === procId);
      if (p) {
        p.collapsed = !p.collapsed;
        haptic();
        saveData();
      }
    }

    function deleteProcess(procId) {
      if (confirm("Удалить это направление со всеми объектами?")) {
        state = state.filter(x => x.id !== procId);
        haptic();
        saveData();
      }
    }

    function toggleAddStepForm(procId, objId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      obj.showAddForm = !obj.showAddForm;
      render();
    }

    function archiveObject(procId, objId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      obj.archived = true;
      showToast(`«${obj.title}» перенесен в архив!`);
      haptic();
      saveData();
    }

    function restoreObject(procId, objId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      obj.archived = false;
      showToast(`«${obj.title}» возвращен в работу`);
      haptic();
      saveData();
    }

    function toggleArchiveView(procId) {
      const p = state.find(x => x.id === procId);
      if (p) {
        p.showArchive = !p.showArchive;
        render();
      }
    }

    function promptToggleBlocker(procId, objId, stepId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;
      const step = obj.steps.find(s => s.id === stepId);
      if (!step) return;

      const current = step.blocker || "Оплата не идет у подрядчика";
      const reason = prompt("Укажите причину задержки / блокер:", current);

      if (reason !== null) {
        step.blocker = reason.trim() === "" ? null : reason.trim();
        showToast(step.blocker ? "Зафиксирована задержка!" : "Задержка снята");
        haptic();
        saveData();
      }
    }

    function clearBlocker(procId, objId, stepId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;
      const step = obj.steps.find(s => s.id === stepId);
      if (step) {
        step.blocker = null;
        showToast("Задержка снята");
        haptic();
        saveData();
      }
    }

    function promptAddObject(procId) {
      const name = prompt("Название объекта / участка (напр. Макат - Дорога Ескене):");
      if (!name || !name.trim()) return;

      const p = state.find(x => x.id === procId);
      if (p) {
        p.objects.push({
          id: Date.now(),
          title: name.trim(),
          archived: false,
          showAddForm: false,
          steps: []
        });
        haptic();
        saveData();
      }
    }

    /* АВТОМАТИЧЕСКИЙ РАСЧЕТ СРОКОВ ПО РЕГЛАМЕНТУ (+3, +7, +15, +25, +35 дней) */
    function createObjectWithStandardWorkflow(procId) {
      const name = prompt("Название объекта (сроки рассчитаются по регламенту):");
      if (!name || !name.trim()) return;

      const p = state.find(x => x.id === procId);
      if (p) {
        p.objects.push({
          id: Date.now(),
          title: name.trim(),
          archived: false,
          showAddForm: false,
          steps: STANDARD_WORKFLOW.map((item, idx) => ({
            id: Date.now() + idx,
            text: item.text,
            date: getOffsetDateStr(item.days),
            done: false,
            blocker: null
          }))
        });
        showToast("Создан объект со сроками по регламенту!");
        haptic();
        saveData();
      }
    }

    function cloneObject(procId, objId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const src = p.objects.find(o => o.id === objId);
      if (!src) return;

      const newTitle = prompt("Новое имя для скопированного объекта:", src.title + " (Копия)");
      if (!newTitle || !newTitle.trim()) return;

      const cloned = {
        id: Date.now(),
        title: newTitle.trim(),
        archived: false,
        showAddForm: false,
        steps: src.steps.map((s, i) => ({
          id: Date.now() + i + 1,
          text: s.text,
          date: s.date,
          done: false,
          blocker: null
        }))
      };

      p.objects.push(cloned);
      showToast("Структура скопирована!");
      haptic();
      saveData();
    }

    function applyStandardWorkflowToObject(procId, objId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      STANDARD_WORKFLOW.forEach((item, idx) => {
        obj.steps.push({
          id: Date.now() + idx,
          text: item.text,
          date: getOffsetDateStr(item.days),
          done: false,
          blocker: null
        });
      });

      showToast("5 этапов со сроками добавлены!");
      haptic();
      saveData();
    }

    function quickAddStepChip(procId, objId, stepText, offsetDays) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      const autoDate = offsetDays ? getOffsetDateStr(offsetDays) : getTodayStr();

      obj.steps.push({
        id: Date.now(),
        text: stepText,
        date: autoDate,
        done: false,
        blocker: null
      });

      haptic();
      saveData();
    }

    function deleteObject(procId, objId) {
      if (confirm("Удалить данный объект навсегда?")) {
        const p = state.find(x => x.id === procId);
        if (p) {
          p.objects = p.objects.filter(o => o.id !== objId);
          haptic();
          saveData();
        }
      }
    }

    function editObjectTitle(procId, objId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      const newTitle = prompt("Название объекта:", obj.title);
      if (newTitle && newTitle.trim()) {
        obj.title = newTitle.trim();
        haptic();
        saveData();
      }
    }

    function addStepToObject(procId, objId) {
      const tInput = document.getElementById(`txt-${objId}`);
      const dInput = document.getElementById(`date-${objId}`);
      if (!tInput) return;

      const txt = tInput.value.trim();
      const dt = (dInput ? dInput.value.trim() : '') || getTodayStr();
      if (!txt) return;

      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      obj.steps.push({
        id: Date.now(),
        text: txt,
        date: dt,
        done: false,
        blocker: null
      });

      tInput.value = '';
      if (dInput) dInput.value = getTodayStr();

      haptic();
      saveData();
    }

    function toggleStep(procId, objId, stepId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;
      const step = obj.steps.find(s => s.id === stepId);
      if (step) {
        step.done = !step.done;
        if (step.done) step.blocker = null;
        haptic();
        saveData();
      }
    }

    function editStepDate(procId, objId, stepId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;
      const step = obj.steps.find(s => s.id === stepId);
      if (!step) return;

      const newDate = prompt("Срок или интервал (напр. до 10.09.2026, 08.09-12.09):", step.date);
      if (newDate && newDate.trim()) {
        step.date = newDate.trim();
        haptic();
        saveData();
      }
    }

    function editStepText(procId, objId, stepId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;
      const step = obj.steps.find(s => s.id === stepId);
      if (!step) return;

      const newTxt = prompt("Описание этапа / задачи:", step.text);
      if (newTxt && newTxt.trim()) {
        step.text = newTxt.trim();
        haptic();
        saveData();
      }
    }

    function deleteStep(procId, objId, stepId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      obj.steps = obj.steps.filter(s => s.id !== stepId);
      haptic();
      saveData();
    }

    function setChipDate(objId, val) {
      const input = document.getElementById(`date-${objId}`);
      if (input) input.value = val;
    }

      root.innerHTML = '';

      let totalDone = 0;
      let totalPlan = 0;
      let totalActiveObjs = 0;
      let totalBlockers = 0;

      state.forEach(proc => {
        const card = document.createElement('div');
        card.className = 'process-section';

        const activeObjects = proc.objects.filter(o => !o.archived);
        const archivedObjects = proc.objects.filter(o => o.archived);

        activeObjects.forEach(o => {
          totalActiveObjs++;
          o.steps.forEach(s => {
            if (s.done) totalDone++;
            else {
              totalPlan++;
              if (s.blocker) totalBlockers++;
            }

        card.innerHTML = `
          <div class="process-header" onclick="toggleProcessCollapse(${proc.id})">

                    ${obj.steps.map(s => {
                      const hasBlock = !s.done && !!s.blocker;
                      const dateMeta = analyzeDeadline(s.date, s.done);

                      return `
                        <div class="step-item ${s.done ? 'is-done' : ''} ${hasBlock ? 'has-blocker' : ''}">
                          <div class="step-header-line">
                            <input type="checkbox" class="step-chk" ${s.done ? 'checked' : ''} onchange="toggleStep(${proc.id}, ${obj.id}, ${s.id})">
                            <span class="step-title" onclick="editStepText(${proc.id}, ${obj.id}, ${s.id})" title="Изменить текст">${escapeHtml(s.text)}</span>
                          </div>

                          <div class="step-footer-line">
                            <div class="step-actions-left">
                              <span class="step-date-tag ${dateMeta.cls}" onclick="editStepDate(${proc.id}, ${obj.id}, ${s.id})" title="Изменить срок">

                              <button class="btn-blocker-trigger ${hasBlock ? 'active' : ''}" onclick="promptToggleBlocker(${proc.id}, ${obj.id}, ${s.id})">

                              <span class="reason-text" onclick="promptToggleBlocker(${proc.id}, ${obj.id}, ${s.id})">
                                🚨 ${escapeHtml(s.blocker)}

                              <button class="blocker-clear-btn" onclick="clearBlocker(${proc.id}, ${obj.id}, ${s.id})">Снять</button>

                <div class="archive-header" onclick="toggleArchiveView(${proc.id})">
                  <span>🗄 Архив закрытых объектов (${archivedObjects.length})</span>
                  <span>${proc.showArchive ? '▲ Скрыть' : '▼ Показать'}</span>
                </div>
                ${proc.showArchive ? `
                  <div class="archive-list">
                    ${archivedObjects.map(ao => `
                      <div class="archive-item">
                        <span style="font-weight:700; color:#166534;">✔ 📌 ${escapeHtml(ao.title)} (100%)</span>
                        <button class="btn-restore" onclick="restoreObject(${proc.id}, ${ao.id})">↩ Вернуть</button>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            ` : ''}
          </div>
        `;

        root.appendChild(card);
      });

      const bCard = document.getElementById('mBlockersCard');
      if (bCard) {
        if (totalBlockers > 0) {
          bCard.className = 'metric-card has-danger';
        } else {
          bCard.className = 'metric-card';
        }
      }

      document.getElementById('mBlockers').textContent = totalBlockers;
      document.getElementById('mDone').textContent = totalDone;
      document.getElementById('mPlan').textContent = totalPlan;
      document.getElementById('mTotal').textContent = totalActiveObjs;
    }

    /* ОТЧЕТ ДЛЯ TELEGRAM */
    function generateTelegramReport() {
      const today = getTodayStr();

      const blockers = [];
      state.forEach(p => {
        p.objects.filter(o => !o.archived).forEach(o => {
          o.steps.forEach(s => {
            if (!s.done && s.blocker) {
              blockers.push({
                proc: p.title,
                obj: o.title,
                step: s.text,
                date: s.date,
                reason: s.blocker
              });
            }
          });
        });
      });

      const archivedList = [];
      state.forEach(p => {
        p.objects.filter(o => o.archived).forEach(o => {
          archivedList.push({ proc: p.title, obj: o.title });
        });
      });

      if (reportMode === 'executive') {
        let txt = `📊 ОТЧЕТ ПО ПРОЕКТАМ | ${today}

`;

        if (blockers.length > 0) {
          txt += `🚨 ТРЕБУЕТ ВНИМАНИЯ / БЛОКЕРЫ:
`;
          blockers.forEach(b => {
            txt += `• ${b.obj} (${b.proc}):
`;
            txt += `  ⚠️ ${b.step} [${b.date}]
`;
            txt += `     └ Причина: ${b.reason}
`;
          });
          txt += `
`;
        }

        let hasDone = false;
        let doneTxt = `✅ РЕЗУЛЬТАТЫ ЗА СЕГОДНЯ:
`;
        state.forEach(p => {
          p.objects.filter(o => !o.archived).forEach(o => {
            const todayDoneSteps = o.steps.filter(s => s.done);
            if (todayDoneSteps.length > 0) {
              hasDone = true;
              doneTxt += `• ${o.title} (${p.title}):
`;
              todayDoneSteps.forEach(s => {
                doneTxt += `  - ${s.text} [закрыто]
`;
              });
            }
          });
        });
        if (!hasDone) doneTxt += `• Текущие работы без закрытых этапов
`;
        txt += doneTxt + `
`;

        if (archivedList.length > 0) {
          txt += `🏆 ПОЛНОСТЬЮ ЗАВЕРШЕННЫЕ ОБЪЕКТЫ (100%):
`;
          archivedList.forEach(a => {
            txt += `• 📌 ${a.obj} (${a.proc}) — оформление полностью закрыто
`;
          });
          txt += `
`;
        }

        let hasPlan = false;
        let planTxt = `⏳ В ШТАТНОЙ РАБОТЕ / ПЛАНЫ:
`;
        state.forEach(p => {
          p.objects.filter(o => !o.archived).forEach(o => {
            const regularSteps = o.steps.filter(s => !s.done && !s.blocker);
            if (regularSteps.length > 0) {
              hasPlan = true;
              planTxt += `• ${o.title} (${p.title}):
`;
              regularSteps.forEach(s => {
                planTxt += `  - ${s.text} [${s.date}]
`;
              });
            }
          });
        });
        if (!hasPlan && blockers.length === 0) planTxt += `• Все текущие этапы завершены!
`;
        txt += planTxt;

        return txt.trim();

      } else {
        let txt = `📋 ПОЛНАЯ СВОДКА ПО ОБЪЕКТАМ | ${today}

`;

        if (blockers.length > 0) {
          txt += `🚨 КРИТИЧЕСКИЕ ЗАДЕРЖКИ (${blockers.length}):
`;
          blockers.forEach(b => {
            txt += `• ${b.obj}: ${b.step} — ${b.reason} [${b.date}]
`;
          });
          txt += `
`;
        }

        state.forEach(p => {
          const active = p.objects.filter(o => !o.archived);
          txt += `📂 НАПРАВЛЕНИЕ: ${p.title.toUpperCase()}
`;
          if (active.length === 0) {
            txt += `  (все объекты завершены и в архиве)

`;
            return;
          }

          active.forEach(o => {
            const d = o.steps.filter(s => s.done).length;
            const t = o.steps.length;
            txt += `📌 ${o.title} [готовность: ${d}/${t}]
`;
            o.steps.forEach(s => {
              const icon = s.done ? '✔' : (s.blocker ? '⚠️' : '⏳');
              const status = s.done ? '[выполнено]' : `[${s.date}]`;
              const blockStr = s.blocker ? ` (БЛОКЕР: ${s.blocker})` : '';
              txt += `  ${icon} ${s.text} ${status}${blockStr}
`;
            });
          });
          txt += `
`;
        });

        if (archivedList.length > 0) {
          txt += `🗄 В АРХИВЕ (ЗАВЕРШЕНО 100%):
`;
          archivedList.forEach(a => {
            txt += `• ${a.obj} (${a.proc})
`;
          });
        }

        return txt.trim();
      }
    }

    function copyReport() {
      const text = generateTelegramReport();
      haptic();

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("Отчет скопирован в буфер!"));
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Отчет скопирован в буфер!");
      }
    }

    function shareToTelegram() {
      const text = generateTelegramReport();
      haptic();

      const url = `https://t.me/share/url?text=${encodeURIComponent(text)}`;
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toastMsg');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2400);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, '&quot;');
    }

    loadData();
  </script>
</body>
</html>
