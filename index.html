<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Управленческий трекер проектов</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff6ff;

      --done: #16a34a;
      --done-bg: #f0fdf4;
      --done-border: #bbf7d0;

      --work: #d97706;
      --work-bg: #fffbeb;
      --work-border: #fde68a;

      --danger: #ef4444;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 100px; /* запас под плавающую панель отчетов */
      font-size: 16px;
      line-height: 1.5;
    }

    .app-container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* 1. ПАНЕЛЬ РУКОВОДИТЕЛЯ (Executive Dashboard) */
    .dashboard-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .dash-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .dash-title {
      font-size: 19px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sync-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      background: #e0f2fe;
      color: #0369a1;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .metric-card {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
    }
    .metric-card.green {
      background: var(--done-bg);
      border-color: var(--done-border);
      color: #166534;
    }
    .metric-card.amber {
      background: var(--work-bg);
      border-color: var(--work-border);
      color: #92400e;
    }
    .metric-card.blue {
      background: var(--accent-light);
      border-color: #bfdbfe;
      color: #1e40af;
    }
    .metric-lbl {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.85;
    }
    .metric-num {
      font-size: 20px;
      font-weight: 800;
      margin-top: 2px;
    }

    /* Выбор формата отчета */
    .report-modes {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .report-mode-btn {
      flex: 1;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
    }
    .report-mode-btn.active {
      background: var(--text-main);
      color: #ffffff;
      border-color: var(--text-main);
    }

    /* 2. БЫСТРОЕ ДОБАВЛЕНИЕ НАПРАВЛЕНИЯ */
    .quick-add-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .quick-add-bar input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      outline: none;
    }
    .quick-add-bar input:focus {
      border-color: var(--accent);
    }
    .btn-dark {
      background: #1e293b;
      color: #ffffff;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 3. КАРТОЧКА ПРОЦЕССА */
    .process-section {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      overflow: hidden;
    }

    .process-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid #f1f5f9;
    }
    .process-header:hover {
      background: #f8fafc;
    }

    .proc-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
    }
    .proc-arrow {
      font-size: 12px;
      color: var(--text-muted);
      transition: transform 0.2s;
    }
    .proc-arrow.collapsed {
      transform: rotate(-90deg);
    }

    .proc-meta-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .proc-del-link {
      color: #94a3b8;
      font-size: 13px;
      background: none;
      border: none;
      cursor: pointer;
    }
    .proc-del-link:hover {
      color: var(--danger);
    }

    .process-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .process-body.hidden {
      display: none;
    }

    /* 4. ОБЪЕКТЫ / ПРОЕКТЫ (ПОЛНАЯ ШИРИНА) */
    .object-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .object-card.completed-obj {
      background: #fcfdfc;
      border-color: #bbf7d0;
    }

    .obj-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .obj-name {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      flex: 1;
      cursor: pointer;
    }
    .obj-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-percent {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 12px;
      background: #f1f5f9;
      color: #475569;
      white-space: nowrap;
    }
    .badge-percent.green {
      background: var(--done-bg);
      color: #15803d;
    }

    /* Прогресс-бар */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #f1f5f9;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 10px;
      transition: width 0.3s ease;
    }
    .progress-bar-fill.done {
      background: var(--done);
    }

    /* 5. ШАГИ / ЭТАПЫ */
    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .step-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
    }
    .step-item.is-done {
      background: var(--done-bg);
      border-color: var(--done-border);
    }

    .step-main {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    .step-chk {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--done);
      flex-shrink: 0;
    }
    .step-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      line-height: 1.35;
      word-break: break-word;
    }
    .step-item.is-done .step-title {
      text-decoration: line-through;
      color: #166534;
      opacity: 0.7;
    }

    .step-aside {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .step-date-tag {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .step-item.is-done .step-date-tag {
      border-color: #86efac;
      color: #166534;
    }

    .mini-del {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
    }
    .mini-del:hover {
      color: var(--danger);
    }

    /* 6. ФОРМА БЫСТРОГО ДОБАВЛЕНИЯ ШАГА */
    .step-fast-add {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }
    .sfa-row-1 {
      display: flex;
      gap: 6px;
    }
    .sfa-row-1 input[type="text"] {
      flex: 1;
      padding: 9px 12px;
      font-size: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
    }
    .sfa-row-1 input.date-input {
      width: 140px;
      padding: 9px 10px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      background: #fff;
    }
    @media (max-width: 480px) {
      .sfa-row-1 { flex-direction: column; }
      .sfa-row-1 input.date-input { width: 100%; }
    }

    .sfa-row-2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .quick-chips {
      display: flex;
      gap: 4px;
    }
    .chip {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }
    .chip:hover {
      background: #f1f5f9;
    }

    .btn-add-step {
      background: #334155;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Кнопка добавления объекта */
    .btn-new-obj {
      width: 100%;
      background: #f8fafc;
      color: #475569;
      border: 1px dashed #cbd5e1;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .btn-new-obj:hover {
      background: #f1f5f9;
    }

    /* 7. ПЛАВАЮЩАЯ НИЖНЯЯ ПАНЕЛЬ ДЛЯ ТЕЛЕФОНА (Action Bar) */
    .floating-action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
      display: flex;
      gap: 10px;
      z-index: 100;
      max-width: 860px;
      margin: 0 auto;
    }

    .fab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      color: #ffffff;
      transition: transform 0.1s;
    }
    .fab-btn:active {
      transform: scale(0.98);
    }
    .fab-btn.copy {
      background: #16a34a;
    }
    .fab-btn.send {
      background: #0284c7;
    }

    /* Тост уведомлений */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      display: none;
      z-index: 200;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ПАНЕЛЬ РУКОВОДИТЕЛЯ -->
    <div class="dashboard-card">
      <div class="dash-top">
        <div class="dash-title">
          <span>📊</span> Мониторинг проектов
        </div>
        <div class="sync-badge" id="syncTag">● Синхронизировано</div>
      </div>

      <div class="metrics-grid">
        <div class="metric-card green">
          <span class="metric-lbl">Сделано</span>
          <span class="metric-num" id="mDone">0</span>
        </div>
        <div class="metric-card amber">
          <span class="metric-lbl">В работе</span>
          <span class="metric-num" id="mPlan">0</span>
        </div>
        <div class="metric-card blue">
          <span class="metric-lbl">Объектов</span>
          <span class="metric-num" id="mTotal">0</span>
        </div>
      </div>

      <!-- Выбор формата отчета для руководителя -->
      <div class="report-modes">
        <button class="report-mode-btn active" id="modeExecutive" onclick="setReportMode('executive')">
          ⚡ Отчет за сегодня (Сводка)
        </button>
        <button class="report-mode-btn" id="modeFull" onclick="setReportMode('full')">
          📋 Полный статус-отчет
        </button>
      </div>
    </div>

    <!-- ДОБАВЛЕНИЕ НОВОГО НАПРАВЛЕНИЯ -->
    <div class="quick-add-bar">
      <input type="text" id="newProcInput" placeholder="Новое направление (напр. Оформление сервитута)..." onkeydown="if(event.key==='Enter') addProcess()">
      <button class="btn-dark" onclick="addProcess()">+ Процесс</button>
    </div>

    <!-- СПИСОК ПРОЦЕССОВ И ОБЪЕКТОВ -->
    <div id="processesRoot"></div>
  </div>

  <!-- ПЛАВАЮЩАЯ ПАНЕЛЬ С КНОПКАМИ КОПИРОВАНИЯ (ВСЕГДА ПОД РУКОЙ) -->
  <div class="floating-action-bar">
    <button class="fab-btn copy" onclick="copyReport()">
      📋 Скопировать отчет
    </button>
    <button class="fab-btn send" onclick="shareToTelegram()">
      ✈️ Отправить в Telegram
    </button>
  </div>

  <div class="toast" id="toastMsg">Отчет скопирован!</div>

  <script>
    const tg = window.Telegram?.WebApp;
    const STORAGE_KEY = 'manager_daily_tracker_v5';

    if (tg) {
      tg.ready();
      tg.expand();
    }

    let reportMode = 'executive'; // 'executive' или 'full'

    function getTodayStr() {
      const d = new Date();
      const day = String(d.getDate()).padStart(2, '0');
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const y = d.getFullYear();
      return `${day}.${m}.${y}`;
    }

    function getTomorrowStr() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      const day = String(d.getDate()).padStart(2, '0');
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const y = d.getFullYear();
      return `${day}.${m}.${y}`;
    }

    let state = [
      {
        id: 1,
        title: "по изменению границ СЭЗ",
        collapsed: false,
        objects: [
          {
            id: 101,
            title: "Дорожная карта",
            steps: [
              { id: 1001, text: "Акт сверки НАО", date: "08.09.2026", done: true, doneDate: "08.09.2026" },
              { id: 1002, text: "Экспликация Гипрозем", date: "08.09 – 12.09", done: false, doneDate: null },
              { id: 1003, text: "Постановление акимата", date: "до 18.09", done: false, doneDate: null }
            ]
          }
        ]
      },
      {
        id: 2,
        title: "Дополнительные зем участки",
        collapsed: false,
        objects: [
          {
            id: 201,
            title: "Жылыой - ЛЭС",
            steps: [
              { id: 2001, text: "Акт сверки НАО", date: "08.09.2026", done: true, doneDate: "08.09.2026" },
              { id: 2002, text: "Экспликация Гипрозем", date: "до 12.09", done: false, doneDate: null }
            ]
          },
          {
            id: 202,
            title: "Жылыой - ВП",
            steps: [
              { id: 3001, text: "Акт сверки НАО", date: "08.09.2026", done: false, doneDate: null },
              { id: 3002, text: "Экспликация Гипрозем", date: "до 15.09", done: false, doneDate: null }
            ]
          }
        ]
      }
    ];

    async function loadData() {
      const parseVal = (val) => {
        try {
          const p = JSON.parse(val);
          if (Array.isArray(p)) {
            state = p.map(pr => ({
              ...pr,
              objects: (pr.objects || []).map(o => ({
                ...o,
                steps: (o.steps || []).map(s => ({
                  ...s,
                  doneDate: s.doneDate || (s.done ? getTodayStr() : null)
                }))
              }))
            }));
          }
        } catch(e) {}
      };

      if (tg?.CloudStorage) {
        tg.CloudStorage.getItem(STORAGE_KEY, (err, val) => {
          if (!err && val) {
            parseVal(val);
          } else {
            const local = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('tma_unified_object_tree_v4');
            if (local) parseVal(local);
          }
          render();
        });
      } else {
        const local = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('tma_unified_object_tree_v4');
        if (local) parseVal(local);
        render();
      }
    }

    function saveData() {
      const json = JSON.stringify(state);
      localStorage.setItem(STORAGE_KEY, json);

      if (tg?.CloudStorage) {
        tg.CloudStorage.setItem(STORAGE_KEY, json, (err, ok) => {
          const tag = document.getElementById('syncTag');
          if (ok && tag) {
            tag.textContent = "● Синхронизировано";
            tag.style.color = "#15803d";
          }
        });
      }
      render();
    }

    function haptic() {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function setReportMode(m) {
      reportMode = m;
      document.getElementById('modeExecutive').classList.toggle('active', m === 'executive');
      document.getElementById('modeFull').classList.toggle('active', m === 'full');
      showToast(m === 'executive' ? "Формат: Сводка за сегодня" : "Формат: Полный статус-отчет");
    }

    function addProcess() {
      const input = document.getElementById('newProcInput');
      const val = input.value.trim();
      if (!val) return;

      state.push({
        id: Date.now(),
        title: val,
        collapsed: false,
        objects: []
      });

      input.value = '';
      haptic();
      saveData();
    }

    function toggleProcessCollapse(procId) {
      const p = state.find(x => x.id === procId);
      if (p) {
        p.collapsed = !p.collapsed;
        haptic();
        saveData();
      }
    }

    function deleteProcess(procId) {
      if (confirm("Удалить это направление со всеми объектами?")) {
        state = state.filter(x => x.id !== procId);
        haptic();
        saveData();
      }
    }

    function promptAddObject(procId) {
      const name = prompt("Название объекта / участка (напр. Жылыой - ЛЭС):");
      if (!name || !name.trim()) return;

      const p = state.find(x => x.id === procId);
      if (p) {
        p.objects.push({
          id: Date.now(),
          title: name.trim(),
          steps: []
        });
        haptic();
        saveData();
      }
    }

    function deleteObject(procId, objId) {
      if (confirm("Удалить данный объект?")) {
        const p = state.find(x => x.id === procId);
        if (p) {
          p.objects = p.objects.filter(o => o.id !== objId);
          haptic();
          saveData();
        }
      }
    }

    function editObjectTitle(procId, objId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      const newTitle = prompt("Название объекта:", obj.title);
      if (newTitle && newTitle.trim()) {
        obj.title = newTitle.trim();
        haptic();
        saveData();
      }
    }

    function addStepToObject(procId, objId) {
      const tInput = document.getElementById(`txt-${objId}`);
      const dInput = document.getElementById(`date-${objId}`);
      if (!tInput) return;

      const txt = tInput.value.trim();
      const dt = (dInput ? dInput.value.trim() : '') || getTodayStr();
      if (!txt) return;

      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      obj.steps.push({
        id: Date.now(),
        text: txt,
        date: dt,
        done: false,
        doneDate: null
      });

      tInput.value = '';
      if (dInput) dInput.value = getTodayStr();

      haptic();
      saveData();
    }

    function toggleStep(procId, objId, stepId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;
      const step = obj.steps.find(s => s.id === stepId);
      if (step) {
        step.done = !step.done;
        step.doneDate = step.done ? getTodayStr() : null;
        haptic();
        saveData();
      }
    }

    function editStepDate(procId, objId, stepId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;
      const step = obj.steps.find(s => s.id === stepId);
      if (!step) return;

      const newDate = prompt("Срок или интервал (напр. 08.09.2026, до 15.09, 08.09-12.09):", step.date);
      if (newDate && newDate.trim()) {
        step.date = newDate.trim();
        haptic();
        saveData();
      }
    }

    function editStepText(procId, objId, stepId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;
      const step = obj.steps.find(s => s.id === stepId);
      if (!step) return;

      const newTxt = prompt("Описание этапа / задачи:", step.text);
      if (newTxt && newTxt.trim()) {
        step.text = newTxt.trim();
        haptic();
        saveData();
      }
    }

    function deleteStep(procId, objId, stepId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      obj.steps = obj.steps.filter(s => s.id !== stepId);
      haptic();
      saveData();
    }

    function setChipDate(objId, val) {
      const input = document.getElementById(`date-${objId}`);
      if (input) input.value = val;
    }

    function render() {
      const root = document.getElementById('processesRoot');
      root.innerHTML = '';

      let totalDone = 0;
      let totalPlan = 0;
      let totalObjs = 0;

      state.forEach(proc => {
        const card = document.createElement('div');
        card.className = 'process-section';

        proc.objects.forEach(o => {
          totalObjs++;
          o.steps.forEach(s => {
            if (s.done) totalDone++;
            else totalPlan++;
          });
        });

        const isCollapsed = proc.collapsed;

        card.innerHTML = `
          <div class="process-header" onclick="toggleProcessCollapse(${proc.id})">
            <div class="proc-title-group">
              <span class="proc-arrow ${isCollapsed ? 'collapsed' : ''}">▼</span>
              <span>📂 ${escapeHtml(proc.title)}</span>
              <span style="font-size:13px; color:var(--text-muted); font-weight:normal;">(${proc.objects.length})</span>
            </div>
            <div class="proc-meta-actions">
              <button class="proc-del-link" onclick="event.stopPropagation(); deleteProcess(${proc.id})">Удалить</button>
            </div>
          </div>

          <div class="process-body ${isCollapsed ? 'hidden' : ''}">
            ${proc.objects.map(obj => {
              const dCount = obj.steps.filter(s => s.done).length;
              const tCount = obj.steps.length;
              const percent = tCount > 0 ? Math.round((dCount / tCount) * 100) : 0;
              const isAllDone = tCount > 0 && dCount === tCount;

              return `
                <div class="object-card ${isAllDone ? 'completed-obj' : ''}">
                  <div class="obj-header">
                    <div class="obj-name" onclick="editObjectTitle(${proc.id}, ${obj.id})" title="Нажмите для переименования">
                      📌 ${escapeHtml(obj.title)}
                    </div>
                    <div class="obj-tools">
                      ${tCount > 0 ? `
                        <span class="badge-percent ${isAllDone ? 'green' : ''}">${dCount}/${tCount} (${percent}%)</span>
                      ` : ''}
                      <button class="mini-del" onclick="deleteObject(${proc.id}, ${obj.id})" title="Удалить объект">✕</button>
                    </div>
                  </div>

                  ${tCount > 0 ? `
                    <div class="progress-bar-bg">
                      <div class="progress-bar-fill ${isAllDone ? 'done' : ''}" style="width: ${percent}%;"></div>
                    </div>
                  ` : ''}

                  <!-- Список шагов -->
                  <div class="steps-list">
                    ${obj.steps.map(s => `
                      <div class="step-item ${s.done ? 'is-done' : ''}">
                        <div class="step-main">
                          <input type="checkbox" class="step-chk" ${s.done ? 'checked' : ''} onchange="toggleStep(${proc.id}, ${obj.id}, ${s.id})">
                          <span class="step-title" onclick="editStepText(${proc.id}, ${obj.id}, ${s.id})" title="Изменить текст">${escapeHtml(s.text)}</span>
                        </div>
                        <div class="step-aside">
                          <span class="step-date-tag" onclick="editStepDate(${proc.id}, ${obj.id}, ${s.id})" title="Изменить срок">
                            ${s.done ? '✔ ' : '📅 '}${escapeHtml(s.date)}
                          </span>
                          <button class="mini-del" onclick="deleteStep(${proc.id}, ${obj.id}, ${s.id})">✕</button>
                        </div>
                      </div>
                    `).join('')}
                  </div>

                  <!-- Быстрое добавление шага в 1 клик -->
                  <div class="step-fast-add">
                    <div class="sfa-row-1">
                      <input type="text" id="txt-${obj.id}" placeholder="+ этап / задача..." onkeydown="if(event.key==='Enter') addStepToObject(${proc.id}, ${obj.id})">
                      <input type="text" class="date-input" id="date-${obj.id}" value="${getTodayStr()}" placeholder="Срок">
                    </div>
                    <div class="sfa-row-2">
                      <div class="quick-chips">
                        <button type="button" class="chip" onclick="setChipDate(${obj.id}, '${getTodayStr()}')">Сегодня</button>
                        <button type="button" class="chip" onclick="setChipDate(${obj.id}, '${getTomorrowStr()}')">Завтра</button>
                        <button type="button" class="chip" onclick="setChipDate(${obj.id}, 'до ${getTomorrowStr()}')">Диапазон</button>
                      </div>
                      <button type="button" class="btn-add-step" onclick="addStepToObject(${proc.id}, ${obj.id})">Добавить</button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}

            <button class="btn-new-obj" onclick="promptAddObject(${proc.id})">
              + Добавить объект в «${escapeHtml(proc.title)}»
            </button>
          </div>
        `;

        root.appendChild(card);
      });

      document.getElementById('mDone').textContent = totalDone;
      document.getElementById('mPlan').textContent = totalPlan;
      document.getElementById('mTotal').textContent = totalObjs;
    }

    /* ФОРМИРОВАНИЕ УПРАВЛЕНЧЕСКОГО ОТЧЕТА (TELEGRAM-FRIENDLY) */
    function generateTelegramReport() {
      const today = getTodayStr();

      if (reportMode === 'executive') {
        // Формат «Сводка за сегодня» — то, что нужно руководителю в 18:00
        let txt = `📊 ОТЧЕТ ПО ПРОЕКТАМ | ${today}

`;

        let hasDone = false;
        let doneTxt = `✅ РЕЗУЛЬТАТЫ ЗА СЕГОДНЯ:
`;

        state.forEach(p => {
          p.objects.forEach(o => {
            const todayDoneSteps = o.steps.filter(s => s.done);
            if (todayDoneSteps.length > 0) {
              hasDone = true;
              doneTxt += `• ${o.title} (${p.title}):
`;
              todayDoneSteps.forEach(s => {
                doneTxt += `  - ${s.text} [закрыто]
`;
              });
            }
          });
        });

        if (!hasDone) {
          doneTxt += `• Текущие работы без закрытых этапов
`;
        }

        txt += doneTxt + `
`;

        let hasPlan = false;
        let planTxt = `⏳ В РАБОТЕ И ПЛАНЫ:
`;

        state.forEach(p => {
          p.objects.forEach(o => {
            const pendingSteps = o.steps.filter(s => !s.done);
            if (pendingSteps.length > 0) {
              hasPlan = true;
              planTxt += `• ${o.title} (${p.title}):
`;
              pendingSteps.forEach(s => {
                planTxt += `  - ${s.text} [срок: ${s.date}]
`;
              });
            }
          });
        });

        if (!hasPlan) {
          planTxt += `• Все текущие этапы завершены!
`;
        }

        txt += planTxt;
        return txt.trim();

      } else {
        // Полный статус-отчет по всей картине объектов
        let txt = `📋 ПОЛНАЯ СВОДКА ПО ОБЪЕКТАМ | ${today}

`;

        state.forEach(p => {
          txt += `📂 НАПРАВЛЕНИЕ: ${p.title.toUpperCase()}
`;
          if (p.objects.length === 0) {
            txt += `  (нет объектов)

`;
            return;
          }

          p.objects.forEach(o => {
            const d = o.steps.filter(s => s.done).length;
            const t = o.steps.length;
            txt += `📌 ${o.title} [готовность: ${d}/${t}]
`;
            o.steps.forEach(s => {
              const icon = s.done ? '✔' : '⏳';
              const status = s.done ? '[выполнено]' : `[срок: ${s.date}]`;
              txt += `  ${icon} ${s.text} ${status}
`;
            });
          });
          txt += `
`;
        });

        return txt.trim();
      }
    }

    function copyReport() {
      const text = generateTelegramReport();
      haptic();

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("Отчет скопирован в буфер!"));
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Отчет скопирован в буфер!");
      }
    }

    function shareToTelegram() {
      const text = generateTelegramReport();
      haptic();

      const url = `https://t.me/share/url?text=${encodeURIComponent(text)}`;
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toastMsg');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2400);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, '&quot;');
    }

    loadData();
  </script>
</body>
</html>
