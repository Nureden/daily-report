<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Управленческий трекер проектов</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #e2e8f0;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --border: #cbd5e1;
      --border-subtle: #e2e8f0;

      --brand: #1d4ed8;
      --brand-light: #eff6ff;
      --brand-border: #bfdbfe;

      --done: #15803d;
      --done-bg: #f0fdf4;
      --done-border: #bbf7d0;

      --amber: #b45309;
      --amber-bg: #fffbeb;
      --amber-border: #fde68a;

      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --danger-border: #fca5a5;

      --neutral-dark: #1e293b;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 8px 10px 105px 10px;
      font-size: 15px;
      line-height: 1.45;
    }

    .app-container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* 1. ПАНЕЛЬ РУКОВОДИТЕЛЯ */
    .dashboard-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04);
    }

    .dash-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .dash-title {
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #0f172a;
    }

    .sync-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      background: #f1f5f9;
      color: #475569;
    }
    .sync-badge.active {
      background: #e0f2fe;
      color: #0369a1;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    @media (max-width: 480px) {
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .metric-card {
      padding: 8px 10px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      border: 1px solid transparent;
      background: #f8fafc;
      color: var(--neutral-dark);
    }
    .metric-card.has-danger {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: var(--danger-border);
    }
    .metric-card.is-green {
      background: var(--done-bg);
      color: var(--done);
      border-color: var(--done-border);
    }
    .metric-card.is-amber {
      background: var(--amber-bg);
      color: var(--amber);
      border-color: var(--amber-border);
    }
    .metric-card.is-blue {
      background: var(--brand-light);
      color: #1d4ed8;
      border-color: var(--brand-border);
    }

    .metric-lbl {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      opacity: 0.85;
    }
    .metric-num {
      font-size: 18px;
      font-weight: 800;
      margin-top: 2px;
    }

    .report-modes {
      display: flex;
      gap: 6px;
    }
    .report-mode-btn {
      flex: 1;
      padding: 7px 8px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: #f8fafc;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .report-mode-btn.active {
      background: var(--neutral-dark);
      color: #ffffff;
      border-color: var(--neutral-dark);
    }

    /* 2. БЫСТРЫЙ ВВОД НАПРАВЛЕНИЯ */
    .quick-add-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .quick-add-bar input {
      flex: 1;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      outline: none;
    }
    .quick-add-bar input:focus {
      border-color: var(--brand);
    }
    .btn-dark {
      background: var(--neutral-dark);
      color: #ffffff;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ==============================================================
       УРОВЕНЬ 1: ПАПКА ПРОЦЕССА (ВЫДЕЛЕННЫЙ ТЕМНЫЙ СТИКЕР)
       ============================================================== */
    .process-section {
      background: #e2e8f0;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }

    .process-sticker-header {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
    }

    .proc-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
    }
    .proc-folder-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
    }
    .proc-arrow {
      display: inline-block;
      font-size: 11px;
      color: #94a3b8;
      transition: transform 0.2s ease;
    }
    .proc-arrow.collapsed {
      transform: rotate(-90deg);
    }

    .proc-tag-count {
      font-size: 11px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .proc-del-link {
      color: #f87171;
      font-size: 12px;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .proc-del-link:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    .process-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #e2e8f0;
    }
    .process-body.hidden {
      display: none !important;
    }

    /* ==============================================================
       УРОВЕНЬ 2: ОБЪЕКТ / УЧАСТОК (БЕЛЫЙ БИЛЕТ С СИНИМ КАНТОМ)
       ============================================================== */
    .object-card {
      background: #ffffff;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      border-left: 5px solid #2563eb;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    .object-card.completed-obj {
      border-left-color: #16a34a;
      background: #fdfefe;
    }

    .obj-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .obj-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .obj-collapse-arrow {
      font-size: 10px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }
    .obj-collapse-arrow.collapsed {
      transform: rotate(-90deg);
    }
    .obj-name {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      word-break: normal;
      overflow-wrap: break-word;
    }
    .obj-tools {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .badge-percent {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 12px;
      background: #f1f5f9;
      color: #475569;
      white-space: nowrap;
    }
    .badge-percent.green {
      background: var(--done-bg);
      color: var(--done);
      border: 1px solid var(--done-border);
    }

    .btn-icon-tool {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12px;
      cursor: pointer;
      color: #475569;
    }
    .btn-icon-tool:hover {
      background: #f1f5f9;
    }
    .btn-icon-tool.del:hover {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: var(--danger-border);
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--brand);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .progress-bar-fill.done {
      background: var(--done);
    }

    .obj-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px dashed #e2e8f0;
    }
    .obj-body.hidden {
      display: none !important;
    }

    /* ==============================================================
       УРОВЕНЬ 3: ШАГИ / ПОДЗАДАЧИ (ПЛАШКИ ВНУТРИ БИЛЕТА)
       ============================================================== */
    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .step-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }
    .step-item.is-done {
      background: var(--done-bg);
      border-color: var(--done-border);
    }
    .step-item.has-blocker {
      background: var(--danger-bg);
      border-color: var(--danger-border);
    }

    .step-header-line {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      width: 100%;
    }
    .step-chk {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--done);
      margin-top: 1px;
      flex-shrink: 0;
    }
    .step-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      line-height: 1.35;
      flex: 1;
      word-break: normal;
      overflow-wrap: break-word;
      hyphens: none;
    }
    .step-item.is-done .step-title {
      text-decoration: line-through;
      color: var(--done);
      opacity: 0.7;
    }

    .step-footer-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-left: 27px;
    }

    .step-actions-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .step-date-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .step-date-btn:active {
      transform: scale(0.96);
    }
    .step-date-btn.overdue {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #991b1b;
    }
    .step-date-btn.urgent {
      background: #fef3c7;
      border-color: #fde68a;
      color: #92400e;
    }
    .step-date-btn.done {
      background: #ffffff;
      border-color: var(--done-border);
      color: var(--done);
    }
    .step-date-btn.empty {
      color: var(--brand);
      border-style: dashed;
      border-color: var(--brand-border);
      background: var(--brand-light);
    }

    .btn-blocker-trigger {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: #64748b;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .btn-blocker-trigger:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .btn-blocker-trigger.active {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #991b1b;
      font-weight: 700;
    }

    .mini-del {
      background: none;
      border: none;
      color: var(--text-subtle);
      font-size: 13px;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .mini-del:hover {
      color: var(--danger);
      background: rgba(0,0,0,0.04);
    }

    .blocker-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #ffffff;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      color: #991b1b;
      font-weight: 600;
      margin-left: 27px;
    }
    .blocker-banner span.reason-text {
      flex: 1;
      cursor: pointer;
    }
    .blocker-clear-btn {
      background: none;
      border: none;
      color: #991b1b;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 4px;
    }

    .all-done-banner {
      background: var(--done-bg);
      border: 1px dashed var(--done-border);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .all-done-banner span {
      font-size: 12px;
      font-weight: 700;
      color: var(--done);
    }
    .btn-finish-work {
      background: var(--done);
      color: #ffffff;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .step-add-toggle-btn {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      margin-top: 2px;
    }
    .step-add-toggle-btn:hover {
      background: #ffffff;
      color: var(--text-main);
    }

    .step-fast-add {
      background: #f8fafc;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 2px;
    }

    .template-chips-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 2px;
    }
    .tpl-chip {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .tpl-chip:hover {
      background: var(--brand-light);
      border-color: var(--brand-border);
      color: var(--brand);
    }
    .tpl-chip.preset-all {
      background: var(--done-bg);
      border-color: var(--done-border);
      color: var(--done);
      font-weight: 700;
    }

    .sfa-row-1 {
      display: flex;
      gap: 6px;
    }
    .sfa-row-1 input[type="text"] {
      flex: 1;
      padding: 7px 9px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
    }
    .sfa-row-1 input[type="date"] {
      width: 130px;
      padding: 6px 8px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      background: #fff;
    }

    .sfa-row-2 {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
    }

    .btn-add-step {
      background: var(--neutral-dark);
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .proc-add-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .btn-new-obj {
      flex: 1;
      background: #ffffff;
      color: var(--neutral-dark);
      border: 1px dashed #94a3b8;
      padding: 9px 6px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .btn-new-obj.template {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #1e40af;
    }

    .archive-section {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .archive-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .archive-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .archive-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      background: #f8fafc;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      font-size: 13px;
    }
    .btn-restore {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    /* 6. ПЛАВАЮЩАЯ ПАНЕЛЬ */
    .floating-action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
      display: flex;
      gap: 8px;
      z-index: 100;
      max-width: 860px;
      margin: 0 auto;
    }

    .fab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      color: #ffffff;
    }
    .fab-btn.copy { background: #16a34a; }
    .fab-btn.send { background: #0284c7; }

    /* 7. МОДАЛЬНОЕ ОКНО */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
      backdrop-filter: blur(2px);
    }
    @media (min-width: 600px) {
      .modal-overlay { align-items: center; }
    }

    .modal-sheet {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      border-radius: 16px 16px 0 0;
      padding: 16px;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }
    @media (min-width: 600px) {
      .modal-sheet { border-radius: 16px; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 18px;
      color: #94a3b8;
      cursor: pointer;
      padding: 2px 6px;
    }

    .modal-step-name {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: -6px;
    }

    .modal-preset-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .preset-btn {
      text-align: left;
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.1s;
    }
    .preset-btn:hover {
      background: #eff6ff;
      border-color: var(--brand-border);
      color: var(--brand);
    }

    .modal-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .modal-input:focus {
      border-color: var(--brand);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .modal-btn-primary {
      flex: 1;
      background: var(--brand);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-btn-danger {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 2000;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ПАНЕЛЬ РУКОВОДИТЕЛЯ -->
    <div class="dashboard-card">
      <div class="dash-top">
        <div class="dash-title">
          <span>📊</span> Мониторинг проектов
        </div>
        <div class="sync-badge active" id="syncTag">● Синхронизировано</div>
      </div>

      <div class="metrics-grid">
        <div class="metric-card" id="mBlockersCard">
          <span class="metric-lbl">Задержки</span>
          <span class="metric-num" id="mBlockers">0</span>
        </div>
        <div class="metric-card is-green">
          <span class="metric-lbl">Сделано</span>
          <span class="metric-num" id="mDone">0</span>
        </div>
        <div class="metric-card is-amber">
          <span class="metric-lbl">В работе</span>
          <span class="metric-num" id="mPlan">0</span>
        </div>
        <div class="metric-card is-blue">
          <span class="metric-lbl">Объектов</span>
          <span class="metric-num" id="mTotal">0</span>
        </div>
      </div>

      <div class="report-modes">
        <button class="report-mode-btn active" id="modeExecutive" onclick="setReportMode('executive')">
          ⚡ Сводка за сегодня
        </button>
        <button class="report-mode-btn" id="modeFull" onclick="setReportMode('full')">
          📋 Полный отчет
        </button>
      </div>
    </div>

    <!-- БЫСТРЫЙ ВВОД НАПРАВЛЕНИЯ -->
    <div class="quick-add-bar">
      <input type="text" id="newProcInput" placeholder="Новое направление (напр. Сервитуты)..." onkeydown="if(event.key==='Enter') addProcess()">
      <button class="btn-dark" onclick="addProcess()">+ Процесс</button>
    </div>

    <!-- СПИСОК ПРОЦЕССОВ И ОБЪЕКТОВ -->
    <div id="processesRoot"></div>
  </div>

  <!-- ПЛАВАЮЩАЯ ПАНЕЛЬ -->
  <div class="floating-action-bar">
    <button class="fab-btn copy" onclick="copyReport()">
      📋 Скопировать отчет
    </button>
    <button class="fab-btn send" onclick="shareToTelegram()">
      ✈️ Отправить в Telegram
    </button>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО: ВЫБОР ДАТЫ -->
  <div class="modal-overlay" id="dateModalOverlay" onclick="closeDateModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">📅 Выбрать срок этапа</div>
        <button class="modal-close" onclick="closeDateModal()">✕</button>
      </div>
      <div class="modal-step-name" id="dateModalStepTitle">Этап...</div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:12px; font-weight:700; color:var(--text-muted);">Точная дата по календарю:</label>
        <input type="date" id="modalDatePickerInput" class="modal-input" style="font-size:16px;">
      </div>

      <div style="display:flex; flex-direction:column; gap:6px; margin-top:4px;">
        <label style="font-size:12px; font-weight:700; color:var(--text-muted);">Быстрый выбор:</label>
        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:6px;">
          <button type="button" class="preset-btn" style="justify-content:center;" onclick="setModalDateOffset(0)">Сегодня</button>
          <button type="button" class="preset-btn" style="justify-content:center;" onclick="setModalDateOffset(1)">Завтра</button>
          <button type="button" class="preset-btn" style="justify-content:center;" onclick="setModalDateOffset(3)">+3 дня</button>
          <button type="button" class="preset-btn" style="justify-content:center;" onclick="setModalDateOffset(7)">+7 дней</button>
          <button type="button" class="preset-btn" style="justify-content:center;" onclick="setModalDateOffset(15)">+15 дней</button>
          <button type="button" class="preset-btn" style="justify-content:center;" onclick="setModalDateOffset(30)">+1 месяц</button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="modal-btn-primary" onclick="saveDateFromModal()">Сохранить срок</button>
        <button class="modal-btn-danger" onclick="clearDateFromModal()">Без даты</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО: ВЫБОР РИСКА -->
  <div class="modal-overlay" id="riskModalOverlay" onclick="closeRiskModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">🚨 Причина задержки</div>
        <button class="modal-close" onclick="closeRiskModal()">✕</button>
      </div>
      <div class="modal-step-name" id="riskModalStepTitle">Этап...</div>

      <div class="modal-preset-grid">
        <button type="button" class="preset-btn" onclick="selectRiskPreset('Оплата не идет у подрядчика')">
          💳 Оплата не идет у подрядчика
        </button>
        <button type="button" class="preset-btn" onclick="selectRiskPreset('На согласовании в акимате / МИО')">
          🏛 На согласовании в акимате / МИО
        </button>
        <button type="button" class="preset-btn" onclick="selectRiskPreset('Замечания НАО / Гипрозем')">
          📐 Замечания НАО / Гипрозем
        </button>
        <button type="button" class="preset-btn" onclick="selectRiskPreset('Спор / согласование со смежниками')">
          🤝 Спор / согласование со смежниками
        </button>
        <button type="button" class="preset-btn" onclick="selectRiskPreset('Ожидание земельной комиссии')">
          ⚖️ Ожидание земельной комиссии
        </button>
        <button type="button" class="preset-btn" onclick="selectRiskPreset('Ожидание подписания постановления')">
          📜 Ожидание подписания постановления
        </button>
      </div>

      <div style="display:flex; flex-direction:column; gap:4px; margin-top:4px;">
        <label style="font-size:12px; font-weight:700; color:var(--text-muted);">Или введите свою причину:</label>
        <input type="text" id="customRiskInput" class="modal-input" placeholder="Например: Задержка полевого выезда...">
      </div>

      <div class="modal-actions">
        <button class="modal-btn-primary" onclick="saveRiskFromModal()">Зафиксировать</button>
        <button class="modal-btn-danger" id="riskClearBtn" onclick="clearRiskFromModal()">Снять</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg">Отчет скопирован!</div>

  <script>
    const tg = window.Telegram?.WebApp;
    
    // ЕДИНЫЙ ПОСТОЯННЫЙ КЛЮЧ
    const MAIN_STORAGE_KEY = 'manager_projects_permanent_data';

    // Список всех старых версий для автоматического восстановления
    const LEGACY_STORAGE_KEYS = [
      'manager_daily_tracker_v16_subtask_collapse',
      'manager_daily_tracker_v15_collapsed_default',
      'manager_daily_tracker_v14_always_open',
      'manager_daily_tracker_v13_modal_calendar',
      'manager_daily_tracker_v12_calendar',
      'manager_daily_tracker_v11_reglament',
      'manager_daily_tracker_v10_refined',
      'manager_daily_tracker_v9_mobile',
      'manager_daily_tracker_v8_archive',
      'manager_daily_tracker_v7_blockers',
      'manager_daily_tracker_v6_auto',
      'manager_daily_tracker_v5',
      'tma_unified_object_tree_v4'
    ];

    if (tg) {
      tg.ready();
      tg.expand();
    }

    let reportMode = 'executive';
    let activeModalTarget = { procId: null, objId: null, stepId: null };

    const STANDARD_WORKFLOW = [
      "Акт сверки НАО",
      "Экспликация Гипрозем",
      "Утверждение ЗУП МИО",
      "Постановление акима",
      "Акт на землю, регистрация"
    ];

    function getTodayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getTodayStr() {
      const d = new Date();
      const day = String(d.getDate()).padStart(2, '0');
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const y = d.getFullYear();
      return `${day}.${m}.${y}`;
    }

    function isoToDisplay(isoStr) {
      if (!isoStr) return '';
      const p = isoStr.split('-');
      if (p.length === 3) return `до ${p[2]}.${p[1]}.${p[0]}`;
      return isoStr;
    }

    function displayToISO(dispStr) {
      if (!dispStr) return '';
      const match = dispStr.match(/(\d{1,2})\.(\d{1,2})\.?(\d{4})?/);
      if (!match) return '';
      const day = match[1].padStart(2, '0');
      const month = match[2].padStart(2, '0');
      const year = match[3] || new Date().getFullYear();
      return `${year}-${month}-${day}`;
    }

    function analyzeDeadline(dateStr, isDone) {
      if (isDone) return { cls: 'done', text: dateStr || '✔ Выполнено' };
      if (!dateStr) return { cls: 'empty', text: '📅 Выбрать дату' };

      const match = dateStr.match(/(\d{1,2})\.(\d{1,2})\.?(\d{4})?/);
      if (!match) return { cls: '', text: dateStr };

      const day = parseInt(match[1], 10);
      const month = parseInt(match[2], 10) - 1;
      const year = match[3] ? parseInt(match[3], 10) : new Date().getFullYear();

      const target = new Date(year, month, day);
      const today = new Date();
      today.setHours(0,0,0,0);
      target.setHours(0,0,0,0);

      const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        return { cls: 'overdue', text: `🔴 Просрочено (${dateStr})` };
      } else if (diffDays === 0) {
        return { cls: 'urgent', text: `🟠 Сегодня (${dateStr})` };
      } else if (diffDays <= 2) {
        return { cls: 'urgent', text: `🟡 ${diffDays} дн. (${dateStr})` };
      }
      return { cls: '', text: `📅 ${dateStr}` };
    }

    // Начальный шаблон на случай абсолютно чистого первого входа
    let state = [
      {
        id: 1,
        title: "Дополнительные зем участки",
        collapsed: false,
        showArchive: false,
        objects: [
          {
            id: 101,
            title: "Жылыой - ЛЭС",
            archived: false,
            collapsed: true,
            showAddForm: false,
            steps: [
              { id: 1001, text: "Акт сверки НАО", date: "до 10.09.2026", done: true, blocker: null },
              { id: 1002, text: "Экспликация Гипрозем", date: "до 10.09.2026", done: true, blocker: null },
              { id: 1003, text: "Утверждение ЗУП МИО", date: "до 20.09.2026", done: false, blocker: null },
              { id: 1004, text: "Постановление акима", date: "до 30.09.2026", done: false, blocker: null },
              { id: 1005, text: "Акт на землю, регистрация", date: "до 11.10.2026", done: false, blocker: null }
            ]
          },
          {
            id: 102,
            title: "Жылыой - ВП",
            archived: false,
            collapsed: true,
            showAddForm: false,
            steps: [
              { id: 2001, text: "Акт сверки НАО", date: "до 10.09.2026", done: false, blocker: null },
              { id: 2002, text: "Экспликация Гипрозем", date: "до 15.09", done: true, blocker: null }
            ]
          }
        ]
      }
    ];

    /* УМНОЕ ОБЪЕДИНЕНИЕ ВСЕХ СТАРЫХ КЛЮЧЕЙ — НИ ОДНА РАБОТА НЕ ПРОПАДАЕТ */
    function mergeStatesList(list) {
      const merged = {};

      list.forEach(st => {
        if (!Array.isArray(st)) return;
        st.forEach(p => {
          const pTitle = (p.title || '').trim();
          if (!pTitle) return;
          const pKey = pTitle.toLowerCase();

          if (!merged[pKey]) {
            merged[pKey] = {
              id: p.id || Date.now() + Math.random(),
              title: pTitle,
              collapsed: false,
              showArchive: false,
              objectsMap: {}
            };
          }

          (p.objects || []).forEach(o => {
            const oTitle = (o.title || '').trim();
            if (!oTitle) return;
            const oKey = oTitle.toLowerCase();
            const oMap = merged[pKey].objectsMap;

            if (!oMap[oKey]) {
              oMap[oKey] = {
                id: o.id || Date.now() + Math.random(),
                title: oTitle,
                archived: !!o.archived,
                collapsed: true,
                showAddForm: false,
                stepsMap: {}
              };
            }

            (o.steps || []).forEach(s => {
              const sText = (s.text || '').trim();
              if (!sText) return;
              const sKey = sText.toLowerCase();
              const sMap = oMap[oKey].stepsMap;

              if (!sMap[sKey]) {
                sMap[sKey] = {
                  id: s.id || Date.now() + Math.random(),
                  text: sText,
                  date: s.date || '',
                  done: !!s.done,
                  blocker: s.blocker || null
                };
              } else {
                if (s.done) sMap[sKey].done = true;
                if (s.date && !sMap[sKey].date) sMap[sKey].date = s.date;
                if (s.blocker) sMap[sKey].blocker = s.blocker;
              }
            });
          });
        });
      });

      const res = [];
      Object.values(merged).forEach(p => {
        const objs = [];
        Object.values(p.objectsMap).forEach(o => {
          o.steps = Object.values(o.stepsMap);
          delete o.stepsMap;
          objs.push(o);
        });
        p.objects = objs;
        delete p.objectsMap;
        res.push(p);
      });

      return res;
    }

    function parseRaw(raw) {
      try {
        const p = JSON.parse(raw);
        if (Array.isArray(p) && p.length > 0) return p;
      } catch(e) {}
      return null;
    }

    /* ЗАГРУЗКА И НАДЕЖНОЕ СОХРАНЕНИЕ */
    async function loadData() {
      const isMigrated = localStorage.getItem('tma_migrated_v17_permanent');

      // Если уже перешли на постоянный ключ — загружаем напрямую без лишних проверок
      if (isMigrated) {
        const localDirect = localStorage.getItem(MAIN_STORAGE_KEY);
        if (localDirect) {
          const parsed = parseRaw(localDirect);
          if (parsed) state = parsed;
        }

        if (tg?.CloudStorage) {
          tg.CloudStorage.getItem(MAIN_STORAGE_KEY, (err, val) => {
            if (!err && val) {
              const cloudParsed = parseRaw(val);
              if (cloudParsed) {
                state = cloudParsed;
                render();
              }
            }
          });
        }
        render();
        return;
      }

      // Единоразовое объединение всех слотов памяти
      const candidates = [];
      const allKeys = [MAIN_STORAGE_KEY, ...LEGACY_STORAGE_KEYS];

      allKeys.forEach(k => {
        const raw = localStorage.getItem(k);
        if (raw) {
          const parsed = parseRaw(raw);
          if (parsed) candidates.push(parsed);
        }
      });

      if (tg?.CloudStorage) {
        tg.CloudStorage.getItems(allKeys, (err, values) => {
          if (!err && values) {
            allKeys.forEach(k => {
              if (values[k]) {
                const parsed = parseRaw(values[k]);
                if (parsed) candidates.push(parsed);
              }
            });
          }

          if (candidates.length > 0) {
            state = mergeStatesList(candidates);
          }
          localStorage.setItem('tma_migrated_v17_permanent', 'true');
          saveData();
          render();
        });
      } else {
        if (candidates.length > 0) {
          state = mergeStatesList(candidates);
        }
        localStorage.setItem('tma_migrated_v17_permanent', 'true');
        saveData();
        render();
      }
    }

    function saveData() {
      const json = JSON.stringify(state);
      localStorage.setItem(MAIN_STORAGE_KEY, json);

      if (tg?.CloudStorage) {
        tg.CloudStorage.setItem(MAIN_STORAGE_KEY, json, (err, ok) => {
          const tag = document.getElementById('syncTag');
          if (ok && tag) {
            tag.textContent = "● Синхронизировано";
            tag.classList.add('active');
          }
        });
      }
      render();
    }

    function haptic() {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function setReportMode(m) {
      reportMode = m;
      document.getElementById('modeExecutive').classList.toggle('active', m === 'executive');
      document.getElementById('modeFull').classList.toggle('active', m === 'full');
      showToast(m === 'executive' ? "Формат: Сводка за сегодня" : "Формат: Полный отчет");
    }

    function addProcess() {
      const input = document.getElementById('newProcInput');
      const val = input.value.trim();
      if (!val) return;

      state.push({
        id: Date.now(),
        title: val,
        collapsed: false,
        showArchive: false,
        objects: []
      });

      input.value = '';
      haptic();
      saveData();
      showToast("Направление добавлено!");
    }

    function toggleProcessCollapse(procId) {
      const p = state.find(x => x.id === procId);
      if (p) {
        p.collapsed = !p.collapsed;
        haptic();
        render();
      }
    }

    function toggleObjectCollapse(procId, objId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      obj.collapsed = !obj.collapsed;
      haptic();
      render();
    }

    function deleteProcess(procId) {
      if (confirm("Удалить это направление со всеми объектами?")) {
        state = state.filter(x => x.id !== procId);
        haptic();
        saveData();
      }
    }

    function toggleAddStepForm(procId, objId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      obj.showAddForm = !obj.showAddForm;
      render();
    }

    function archiveObject(procId, objId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      obj.archived = true;
      showToast(`«${obj.title}» перенесен в архив!`);
      haptic();
      saveData();
    }

    function restoreObject(procId, objId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      obj.archived = false;
      showToast(`«${obj.title}» возвращен в работу`);
      haptic();
      saveData();
    }

    function toggleArchiveView(procId) {
      const p = state.find(x => x.id === procId);
      if (p) {
        p.showArchive = !p.showArchive;
        render();
      }
    }

    /* МОДАЛКА ДАТЫ */
    function openDateModal(procId, objId, stepId) {
      activeModalTarget = { procId, objId, stepId };
      const p = state.find(x => x.id === procId);
      const obj = p?.objects.find(o => o.id === objId);
      const step = obj?.steps.find(s => s.id === stepId);
      if (!step) return;

      document.getElementById('dateModalStepTitle').textContent = `${obj.title} → ${step.text}`;
      const iso = displayToISO(step.date) || getTodayISO();
      document.getElementById('modalDatePickerInput').value = iso;

      document.getElementById('dateModalOverlay').style.display = 'flex';
      haptic();
    }

    function closeDateModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('dateModalOverlay').style.display = 'none';
    }

    function setModalDateOffset(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      document.getElementById('modalDatePickerInput').value = `${y}-${m}-${day}`;
      haptic();
    }

    function saveDateFromModal() {
      const { procId, objId, stepId } = activeModalTarget;
      const p = state.find(x => x.id === procId);
      const obj = p?.objects.find(o => o.id === objId);
      const step = obj?.steps.find(s => s.id === stepId);
      if (!step) return;

      const iso = document.getElementById('modalDatePickerInput').value;
      step.date = iso ? isoToDisplay(iso) : '';
      closeDateModal();
      showToast("Срок сохранен!");
      haptic();
      saveData();
    }

    function clearDateFromModal() {
      const { procId, objId, stepId } = activeModalTarget;
      const p = state.find(x => x.id === procId);
      const obj = p?.objects.find(o => o.id === objId);
      const step = obj?.steps.find(s => s.id === stepId);
      if (!step) return;

      step.date = '';
      closeDateModal();
      showToast("Срок очищен");
      haptic();
      saveData();
    }

    /* МОДАЛКА РИСКОВ */
    function openRiskModal(procId, objId, stepId) {
      activeModalTarget = { procId, objId, stepId };
      const p = state.find(x => x.id === procId);
      const obj = p?.objects.find(o => o.id === objId);
      const step = obj?.steps.find(s => s.id === stepId);
      if (!step) return;

      document.getElementById('riskModalStepTitle').textContent = `${obj.title} → ${step.text}`;
      document.getElementById('customRiskInput').value = step.blocker || '';
      document.getElementById('riskClearBtn').style.display = step.blocker ? 'block' : 'none';

      document.getElementById('riskModalOverlay').style.display = 'flex';
      haptic();
    }

    function closeRiskModal(e) {
      if (e && e.target !== e.currentTarget) return;
      document.getElementById('riskModalOverlay').style.display = 'none';
    }

    function selectRiskPreset(text) {
      document.getElementById('customRiskInput').value = text;
      saveRiskFromModal();
    }

    function saveRiskFromModal() {
      const { procId, objId, stepId } = activeModalTarget;
      const p = state.find(x => x.id === procId);
      const obj = p?.objects.find(o => o.id === objId);
      const step = obj?.steps.find(s => s.id === stepId);
      if (!step) return;

      const val = document.getElementById('customRiskInput').value.trim();
      step.blocker = val !== '' ? val : null;
      closeRiskModal();
      showToast(step.blocker ? "Задержка зафиксирована!" : "Задержка снята");
      haptic();
      saveData();
    }

    function clearBlocker(procId, objId, stepId) {
      const p = state.find(x => x.id == procId);
      const obj = p?.objects.find(o => o.id == objId);
      const step = obj?.steps.find(s => s.id == stepId);
      if (!step) return;

      step.blocker = null;
      showToast("Задержка снята");
      haptic();
      saveData();
    }

    function clearRiskFromModal() {
      const { procId, objId, stepId } = activeModalTarget;
      const p = state.find(x => x.id === procId);
      const obj = p?.objects.find(o => o.id === objId);
      const step = obj?.steps.find(s => s.id === stepId);
      if (!step) return;

      step.blocker = null;
      closeRiskModal();
      showToast("Задержка снята");
      haptic();
      saveData();
    }

    function promptAddObject(procId) {
      const name = prompt("Название объекта / участка (напр. Макат - Дорога Ескене):");
      if (!name || !name.trim()) return;

      const p = state.find(x => x.id === procId);
      if (p) {
        p.objects.push({
          id: Date.now(),
          title: name.trim(),
          archived: false,
          collapsed: false,
          showAddForm: false,
          steps: []
        });
        haptic();
        saveData();
        showToast("Объект создан!");
      }
    }

    function createObjectWithStandardWorkflow(procId) {
      const name = prompt("Название объекта:");
      if (!name || !name.trim()) return;

      const p = state.find(x => x.id === procId);
      if (p) {
        p.objects.push({
          id: Date.now(),
          title: name.trim(),
          archived: false,
          collapsed: false,
          showAddForm: false,
          steps: STANDARD_WORKFLOW.map((text, idx) => ({
            id: Date.now() + idx,
            text: text,
            date: "",
            done: false,
            blocker: null
          }))
        });
        showToast("Создан объект с 5 этапами!");
        haptic();
        saveData();
      }
    }

    function cloneObject(procId, objId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const src = p.objects.find(o => o.id === objId);
      if (!src) return;

      const newTitle = prompt("Новое имя для скопированного объекта:", src.title + " (Копия)");
      if (!newTitle || !newTitle.trim()) return;

      const cloned = {
        id: Date.now(),
        title: newTitle.trim(),
        archived: false,
        collapsed: false,
        showAddForm: false,
        steps: src.steps.map((s, i) => ({
          id: Date.now() + i + 1,
          text: s.text,
          date: s.date,
          done: false,
          blocker: null
        }))
      };

      p.objects.push(cloned);
      showToast("Структура скопирована!");
      haptic();
      saveData();
    }

    function applyStandardWorkflowToObject(procId, objId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      STANDARD_WORKFLOW.forEach((stepText, idx) => {
        obj.steps.push({
          id: Date.now() + idx,
          text: stepText,
          date: "",
          done: false,
          blocker: null
        });
      });

      showToast("5 этапов добавлены!");
      haptic();
      saveData();
    }

    function quickAddStepChip(procId, objId, stepText) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      obj.steps.push({
        id: Date.now(),
        text: stepText,
        date: "",
        done: false,
        blocker: null
      });

      haptic();
      saveData();
      showToast("Этап добавлен!");
    }

    function deleteObject(procId, objId) {
      if (confirm("Удалить данный объект навсегда?")) {
        const p = state.find(x => x.id === procId);
        if (p) {
          p.objects = p.objects.filter(o => o.id !== objId);
          haptic();
          saveData();
        }
      }
    }

    function editObjectTitle(procId, objId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      const newTitle = prompt("Название объекта:", obj.title);
      if (newTitle && newTitle.trim()) {
        obj.title = newTitle.trim();
        haptic();
        saveData();
      }
    }

    /* ДОБАВЛЕНИЕ ЭТАПА — МГНОВЕННОЕ СОХРАНЕНИЕ */
    function addStepToObject(procId, objId) {
      const tInput = document.getElementById(`txt-${objId}`);
      const dInput = document.getElementById(`date-cal-${objId}`);
      if (!tInput) return;

      const txt = tInput.value.trim();
      const isoDate = dInput ? dInput.value : '';
      const dispDate = isoToDisplay(isoDate);

      if (!txt) {
        showToast("Введите название этапа");
        return;
      }

      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      if (!obj.steps) obj.steps = [];

      obj.steps.push({
        id: Date.now(),
        text: txt,
        date: dispDate,
        done: false,
        blocker: null
      });

      tInput.value = '';
      haptic();
      saveData();
      showToast("Этап успешно добавлен!");
    }

    function toggleStep(procId, objId, stepId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;
      const step = obj.steps.find(s => s.id === stepId);
      if (step) {
        step.done = !step.done;
        if (step.done) step.blocker = null;
        haptic();
        saveData();
      }
    }

    function editStepText(procId, objId, stepId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;
      const step = obj.steps.find(s => s.id === stepId);
      if (!step) return;

      const newTxt = prompt("Описание этапа / задачи:", step.text);
      if (newTxt && newTxt.trim()) {
        step.text = newTxt.trim();
        haptic();
        saveData();
      }
    }

    function deleteStep(procId, objId, stepId) {
      const p = state.find(x => x.id === procId);
      if (!p) return;
      const obj = p.objects.find(o => o.id === objId);
      if (!obj) return;

      obj.steps = obj.steps.filter(s => s.id !== stepId);
      haptic();
      saveData();
    }

    function render() {
      const root = document.getElementById('processesRoot');
      root.innerHTML = '';

      let totalDone = 0;
      let totalPlan = 0;
      let totalActiveObjs = 0;
      let totalBlockers = 0;

      state.forEach(proc => {
        const card = document.createElement('div');
        const isCollapsed = !!proc.collapsed;
        card.className = `process-section ${!isCollapsed ? 'is-open' : ''}`;

        const activeObjects = proc.objects.filter(o => !o.archived);
        const archivedObjects = proc.objects.filter(o => o.archived);

        activeObjects.forEach(o => {
          totalActiveObjs++;
          (o.steps || []).forEach(s => {
            if (s.done) totalDone++;
            else {
              totalPlan++;
              if (s.blocker) totalBlockers++;
            }
          });
        });

        card.innerHTML = `
          <!-- УРОВЕНЬ 1: ТЕМНЫЙ ЗАГОЛОВОК ПАПКИ -->
          <div class="process-sticker-header" onclick="toggleProcessCollapse(${proc.id})">
            <div class="proc-title-group">
              <span class="proc-arrow ${isCollapsed ? 'collapsed' : ''}">▼</span>
              <span class="proc-folder-badge">📁 ${escapeHtml(proc.title)}</span>
              <span class="proc-tag-count">${activeObjects.length} в работе</span>
            </div>
            <button class="proc-del-link" onclick="event.stopPropagation(); deleteProcess(${proc.id})">Удалить</button>
          </div>

          <!-- ТЕЛО ПАПКИ: КОНТРАСТНЫЙ СЕРЫЙ ФОН -->
          <div class="process-body ${isCollapsed ? 'hidden' : ''}">
            ${activeObjects.map(obj => {
              const dCount = (obj.steps || []).filter(s => s.done).length;
              const tCount = (obj.steps || []).length;
              const percent = tCount > 0 ? Math.round((dCount / tCount) * 100) : 0;
              const isAllDone = tCount > 0 && dCount === tCount;
              const isObjCollapsed = obj.collapsed !== undefined ? !!obj.collapsed : true;

              return `
                <!-- УРОВЕНЬ 2: БЕЛЫЙ БИЛЕТ ОБЪЕКТА С СИНИМ КАНТОМ -->
                <div class="object-card ${isAllDone ? 'completed-obj' : ''}">
                  <div class="obj-header" onclick="toggleObjectCollapse(${proc.id}, ${obj.id})">
                    <div class="obj-title-wrap">
                      <span class="obj-collapse-arrow ${isObjCollapsed ? 'collapsed' : ''}">▼</span>
                      <span class="obj-name">📌 ${escapeHtml(obj.title)}</span>
                    </div>
                    <div class="obj-tools">
                      ${tCount > 0 ? `
                        <span class="badge-percent ${isAllDone ? 'green' : ''}">${dCount}/${tCount} (${percent}%)</span>
                      ` : ''}
                      <button class="btn-icon-tool" onclick="event.stopPropagation(); editObjectTitle(${proc.id}, ${obj.id})" title="Переименовать">✏️</button>
                      <button class="btn-icon-tool" onclick="event.stopPropagation(); cloneObject(${proc.id}, ${obj.id})" title="Копировать">📋</button>
                      <button class="btn-icon-tool del" onclick="event.stopPropagation(); deleteObject(${proc.id}, ${obj.id})" title="Удалить">✕</button>
                    </div>
                  </div>

                  ${tCount > 0 ? `
                    <div class="progress-bar-bg" onclick="toggleObjectCollapse(${proc.id}, ${obj.id})" style="cursor:pointer;">
                      <div class="progress-bar-fill ${isAllDone ? 'done' : ''}" style="width: ${percent}%;"></div>
                    </div>
                  ` : ''}

                  <!-- УРОВЕНЬ 3: РАСКРЫВАЮЩИЕСЯ ПОДЗАДАЧИ -->
                  <div class="obj-body ${isObjCollapsed ? 'hidden' : ''}">
                    ${isAllDone ? `
                      <div class="all-done-banner">
                        <span>🎉 Все этапы успешно закрыты!</span>
                        <button class="btn-finish-work" onclick="archiveObject(${proc.id}, ${obj.id})">
                          🏁 В архив
                        </button>
                      </div>
                    ` : ''}

                    <div class="steps-list">
                      ${(obj.steps || []).map(s => {
                        const hasBlock = !s.done && !!s.blocker;
                        const dateMeta = analyzeDeadline(s.date, s.done);

                        return `
                          <div class="step-item ${s.done ? 'is-done' : ''} ${hasBlock ? 'has-blocker' : ''}">
                            <div class="step-header-line">
                              <input type="checkbox" class="step-chk" ${s.done ? 'checked' : ''} onchange="toggleStep(${proc.id}, ${obj.id}, ${s.id})">
                              <span class="step-title" onclick="editStepText(${proc.id}, ${obj.id}, ${s.id})" title="Изменить текст">${escapeHtml(s.text)}</span>
                            </div>

                            <div class="step-footer-line">
                              <div class="step-actions-left">
                                <button type="button" class="step-date-btn ${dateMeta.cls}" onclick="openDateModal(${proc.id}, ${obj.id}, ${s.id})">
                                  ${dateMeta.text}
                                </button>
                                <button class="btn-blocker-trigger ${hasBlock ? 'active' : ''}" onclick="openRiskModal(${proc.id}, ${obj.id}, ${s.id})">
                                  ${hasBlock ? '🚨 Задержка' : '+ риск'}
                                </button>
                              </div>
                              <button class="mini-del" onclick="deleteStep(${proc.id}, ${obj.id}, ${s.id})" title="Удалить шаг">✕</button>
                            </div>

                            ${hasBlock ? `
                              <div class="blocker-banner">
                                <span class="reason-text" onclick="openRiskModal(${proc.id}, ${obj.id}, ${s.id})">
                                  🚨 ${escapeHtml(s.blocker)}
                                </span>
                                <button class="blocker-clear-btn" onclick="event.stopPropagation(); clearBlocker(${proc.id}, ${obj.id}, ${s.id})">Снять</button>
                              </div>
                            ` : ''}
                          </div>
                        `;
                      }).join('')}
                    </div>

                    ${!obj.showAddForm ? `
                      <button class="step-add-toggle-btn" onclick="toggleAddStepForm(${proc.id}, ${obj.id})">

                      <div class="step-fast-add">
                        <div class="template-chips-bar">
                          <button type="button" class="tpl-chip preset-all" onclick="applyStandardWorkflowToObject(${proc.id}, ${obj.id})">⚡ + 5 этапов</button>
                          <button type="button" class="tpl-chip" onclick="quickAddStepChip(${proc.id}, ${obj.id}, 'Акт сверки НАО')">+ Акт НАО</button>
                          <button type="button" class="tpl-chip" onclick="quickAddStepChip(${proc.id}, ${obj.id}, 'Экспликация Гипрозем')">+ Экспликация</button>
                          <button type="button" class="tpl-chip" onclick="quickAddStepChip(${proc.id}, ${obj.id}, 'Утверждение ЗУП МИО')">+ ЗУП МИО</button>
                          <button type="button" class="tpl-chip" onclick="quickAddStepChip(${proc.id}, ${obj.id}, 'Постановление акима')">+ Постановление</button>
                          <button type="button" class="tpl-chip" onclick="quickAddStepChip(${proc.id}, ${obj.id}, 'Акт на землю, регистрация')">+ Акт на землю</button>
                        </div>

                        <div class="sfa-row-1">
                          <input type="text" id="txt-${obj.id}" placeholder="Свое название шага..." onkeydown="if(event.key==='Enter') addStepToObject(${proc.id}, ${obj.id})">
                          <input type="date" id="date-cal-${obj.id}" value="${getTodayISO()}">
                        </div>

                        <div class="sfa-row-2">
                          <button type="button" class="tpl-chip" onclick="toggleAddStepForm(${proc.id}, ${obj.id})">Скрыть</button>
                          <button type="button" class="btn-add-step" onclick="addStepToObject(${proc.id}, ${obj.id})">Добавить</button>
                        </div>
                      </div>
                    `}
                  </div>
                </div>
              `;
            }).join('')}

            <div class="proc-add-actions">
              <button class="btn-new-obj template" onclick="createObjectWithStandardWorkflow(${proc.id})">
                ⚡ Создать объект с 5 этапами
              </button>
              <button class="btn-new-obj" onclick="promptAddObject(${proc.id})">
                + Пустой объект
              </button>
            </div>

            ${archivedObjects.length > 0 ? `
              <div class="archive-section">
                <div class="archive-header" onclick="toggleArchiveView(${proc.id})">
                  <span>🗄 Архив закрытых объектов (${archivedObjects.length})</span>
                  <span>${proc.showArchive ? '▲ Скрыть' : '▼ Показать'}</span>
                </div>
                ${proc.showArchive ? `
                  <div class="archive-list">
                    ${archivedObjects.map(ao => `
                      <div class="archive-item">
                        <span style="font-weight:700; color:#166534;">✔ 📌 ${escapeHtml(ao.title)} (100%)</span>
                        <button class="btn-restore" onclick="restoreObject(${proc.id}, ${ao.id})">↩ Вернуть</button>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            ` : ''}
          </div>
        `;

        root.appendChild(card);
      });

      const bCard = document.getElementById('mBlockersCard');
      if (bCard) {
        if (totalBlockers > 0) {
          bCard.className = 'metric-card has-danger';
        } else {
          bCard.className = 'metric-card';
        }
      }

      document.getElementById('mBlockers').textContent = totalBlockers;
      document.getElementById('mDone').textContent = totalDone;
      document.getElementById('mPlan').textContent = totalPlan;
      document.getElementById('mTotal').textContent = totalActiveObjs;
    }

    /* ФОРМИРОВАНИЕ ОТЧЕТА ДЛЯ TELEGRAM */
    function generateTelegramReport() {
      const today = getTodayStr();

      const blockers = [];
      state.forEach(p => {
        (p.objects || []).filter(o => !o.archived).forEach(o => {
          (o.steps || []).forEach(s => {
            if (!s.done && s.blocker) {
              blockers.push({
                proc: p.title,
                obj: o.title,
                step: s.text,
                date: s.date || 'срок не указан',
                reason: s.blocker
              });
            }
          });
        });
      });

      const archivedList = [];
      state.forEach(p => {
        (p.objects || []).filter(o => o.archived).forEach(o => {
          archivedList.push({ proc: p.title, obj: o.title });
        });
      });

      if (reportMode === 'executive') {
        let txt = `📊 ОТЧЕТ ПО ПРОЕКТАМ | ${today}

`;

        if (blockers.length > 0) {
          txt += `🚨 ТРЕБУЕТ ВНИМАНИЯ / БЛОКЕРЫ:
`;
          blockers.forEach(b => {
            txt += `• ${b.obj} (${b.proc}):
`;
            txt += `  ⚠️ ${b.step} [${b.date}]
`;
            txt += `     └ Причина: ${b.reason}
`;
          });
          txt += `
`;
        }

        let hasDone = false;
        let doneTxt = `✅ РЕЗУЛЬТАТЫ ЗА СЕГОДНЯ:
`;
        state.forEach(p => {
          (p.objects || []).filter(o => !o.archived).forEach(o => {
            const todayDoneSteps = (o.steps || []).filter(s => s.done);
            if (todayDoneSteps.length > 0) {
              hasDone = true;
              doneTxt += `• ${o.title} (${p.title}):
`;
              todayDoneSteps.forEach(s => {
                doneTxt += `  - ${s.text} [закрыто]
`;
              });
            }
          });
        });
        if (!hasDone) doneTxt += `• Текущие работы без закрытых этапов
`;
        txt += doneTxt + `
`;

        if (archivedList.length > 0) {
          txt += `🏆 ПОЛНОСТЬЮ ЗАВЕРШЕННЫЕ ОБЪЕКТЫ (100%):
`;
          archivedList.forEach(a => {
            txt += `• 📌 ${a.obj} (${a.proc}) — оформление полностью закрыто
`;
          });
          txt += `
`;
        }

        let hasPlan = false;
        let planTxt = `⏳ В ШТАТНОЙ РАБОТЕ / ПЛАНЫ:
`;
        state.forEach(p => {
          (p.objects || []).filter(o => !o.archived).forEach(o => {
            const regularSteps = (o.steps || []).filter(s => !s.done && !s.blocker);
            if (regularSteps.length > 0) {
              hasPlan = true;
              planTxt += `• ${o.title} (${p.title}):
`;
              regularSteps.forEach(s => {
                const dateStr = s.date ? ` [${s.date}]` : '';
                planTxt += `  - ${s.text}${dateStr}
`;
              });
            }
          });
        });
        if (!hasPlan && blockers.length === 0) planTxt += `• Все текущие этапы завершены!
`;
        txt += planTxt;

        return txt.trim();

      } else {
        let txt = `📋 ПОЛНАЯ СВОДКА ПО ОБЪЕКТАМ | ${today}

`;

        if (blockers.length > 0) {
          txt += `🚨 КРИТИЧЕСКИЕ ЗАДЕРЖКИ (${blockers.length}):
`;
          blockers.forEach(b => {
            txt += `• ${b.obj}: ${b.step} — ${b.reason} [${b.date || 'без даты'}]
`;
          });
          txt += `
`;
        }

        state.forEach(p => {
          const active = (p.objects || []).filter(o => !o.archived);
          txt += `📂 НАПРАВЛЕНИЕ: ${p.title.toUpperCase()}
`;
          if (active.length === 0) {
            txt += `  (все объекты завершены и в архиве)

`;
            return;
          }

          active.forEach(o => {
            const d = (o.steps || []).filter(s => s.done).length;
            const t = (o.steps || []).length;
            txt += `📌 ${o.title} [готовность: ${d}/${t}]
`;
            (o.steps || []).forEach(s => {
              const icon = s.done ? '✔' : (s.blocker ? '⚠️' : '⏳');
              const status = s.done ? '[выполнено]' : (s.date ? `[${s.date}]` : '');
              const blockStr = s.blocker ? ` (БЛОКЕР: ${s.blocker})` : '';
              txt += `  ${icon} ${s.text} ${status}${blockStr}
`;
            });
          });
          txt += `
`;
        });

        if (archivedList.length > 0) {
          txt += `🗄 В АРХИВЕ (ЗАВЕРШЕНО 100%):
`;
          archivedList.forEach(a => {
            txt += `• ${a.obj} (${a.proc})
`;
          });
        }

        return txt.trim();
      }
    }

    function copyReport() {
      const text = generateTelegramReport();
      haptic();

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("Отчет скопирован в буфер!"));
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Отчет скопирован в буфер!");
      }
    }

    function shareToTelegram() {
      const text = generateTelegramReport();
      haptic();

      const url = `https://t.me/share/url?text=${encodeURIComponent(text)}`;
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toastMsg');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2400);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, '&quot;');
    }

    loadData();
  </script>
